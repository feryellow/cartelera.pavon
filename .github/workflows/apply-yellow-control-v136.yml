name: Apply Yellow Control v136 package
on:
  push:
    branches: [upload-v136]
    paths:
      - ".yc-upload/yellow-control-v136.zip"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upload-v136
          fetch-depth: 0
      - name: Apply package
        shell: bash
        run: |
          set -euo pipefail
          unzip -o .yc-upload/yellow-control-v136.zip -d .
          rm -rf .yc-upload
          rm -f .github/workflows/apply-yellow-control-v136.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply Yellow Control v136 package"
          git push origin HEAD:upload-v136
