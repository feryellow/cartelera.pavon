[build]
  publish = "site"
  # Si la comprobación falla, no se publica (la versión anterior sigue en línea)
  command = "node scripts/check.mjs"

[functions]
  directory = "netlify/functions"

# Entrada directa para proveedores: abre su portal (y nada más)
[[redirects]]
  from = "/proveedores"
  to = "/#proveedor"
  status = 302
