<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartelería · Gran Teatro Pavón</title>
<style>
html,body{margin:0;min-height:100%;background:#171310;color:#E8C55A;font-family:Arial,sans-serif}
.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}
.boot strong{display:block;font-size:20px;margin-bottom:8px}
.boot span{font-size:12px;color:#c9b98f}
</style>
</head>
<body>
<div class="boot"><div><strong>Gran Teatro Pavón</strong><span>Cargando plantilla interactiva…</span></div></div>
<script>
(async()=>{
  const parts=Array.from({length:13},(_,i)=>"/bundle/part-"+String(i).padStart(2,"0")+".txt");
  const responses=await Promise.all(parts.map(p=>fetch(p,{cache:"force-cache"})));
  if(responses.some(r=>!r.ok)) throw new Error("No se ha podido cargar la plantilla.");
  let html=(await Promise.all(responses.map(r=>r.text()))).join("");

  const cloudCss=`
.cloud-box{margin:0 0 14px;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:rgba(255,255,255,.02)}
.cloud-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.cloud-title{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:900}
.cloud-status{font-size:10px;color:var(--muted);text-align:right}.cloud-status.ok{color:#d9c875}.cloud-status.dirty{color:#f0c95d}.cloud-status.error{color:#e9a18f}
.cloud-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cloud-actions button{appearance:none;border:1px solid var(--line);background:#28221d;color:var(--cream);border-radius:10px;padding:9px 10px;cursor:pointer;font:800 11px/1 Inter,Arial,sans-serif}.cloud-actions button.primary{background:var(--gold);color:#171310;border-color:var(--gold)}
.cloud-updated{margin-top:8px;color:var(--muted);font-size:10px;line-height:1.35}


/* FASE 1 · NORMALIZACIÓN DE CARTELERÍA */
.view[data-view="abierta"] .stage-card{
  max-width:1100px;
  margin:0 auto;
}
.view[data-view="abierta"] .canvas-shell{
  max-width:760px;
  margin:0 auto;
}
.pavon-support-note{
  margin-top:10px;
  padding:10px 12px;
  border:1px solid rgba(232,197,90,.22);
  border-radius:10px;
  background:rgba(232,197,90,.045);
  color:#c9b98f;
  font-size:11px;
  line-height:1.45;
}
@media(max-width:760px){
  .view[data-view="abierta"] .canvas-shell{max-width:none}
  .pavon-support-note{font-size:12px}
}

/* PAVON MOBILE EXPERIENCE */
.calendar-nav{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
@media(max-width:760px){
  html,body{background:#171310!important;overflow-x:hidden}
  body{font-size:15px!important}
  .topbar{padding:10px 4px 6px!important;gap:10px!important}
  .eyebrow{font-size:12px!important;letter-spacing:.16em!important;margin-bottom:8px!important}
  .brand{min-height:44px!important;padding:9px 12px!important}
  .brand span{font-size:12px!important}
  .tabs{
    display:grid!important;
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    gap:9px!important;
    margin:10px 0 14px!important;
  }
  .tab,.calendar-nav{
    width:100%!important;
    min-height:48px!important;
    box-sizing:border-box!important;
    border-radius:8px!important;
    border:1px solid #EACB68!important;
    background:linear-gradient(180deg,#F5D66C 0%,#C8A140 100%)!important;
    color:#171310!important;
    padding:12px 10px!important;
    font:900 13px/1.1 Inter,Arial,sans-serif!important;
    letter-spacing:.01em!important;
    box-shadow:0 4px 12px rgba(0,0,0,.24),0 0 0 1px rgba(255,229,139,.22) inset!important;
    text-align:center!important;
    text-decoration:none!important;
  }
  .tab.active{
    background:linear-gradient(180deg,#FFE58B 0%,#D7AF45 100%)!important;
    box-shadow:0 5px 18px rgba(232,197,90,.32),0 0 0 1px rgba(255,244,193,.42) inset!important;
  }
  .tab:active,.calendar-nav:active{transform:scale(.985)!important}
  .shell{display:block!important;max-width:none!important;width:100%!important}
  .main{padding:8px 10px 16px!important}
  .stage-card{
    padding:7px!important;
    border-radius:16px!important;
    background:#0f0d0b!important;
    border:1px solid rgba(232,197,90,.22)!important;
    box-shadow:0 8px 26px rgba(0,0,0,.30)!important;
  }
  .view{padding:0!important;background:none!important}
  .view[data-view="abierta"]{padding:0!important;background:none!important}
  .canvas-shell,.view[data-view="abierta"] .canvas-shell{
    width:100%!important;
    max-width:none!important;
    margin:0 auto!important;
    border-radius:13px!important;
  }
  .canvas-shell:hover{
    transform:none!important;
    box-shadow:none!important;
    filter:none!important;
  }
  .stage{
    width:100%!important;
    border-radius:12px!important;
    overflow:hidden!important;
    box-shadow:none!important;
    touch-action:manipulation!important;
  }
  .lightbox-trigger{
    top:10px!important;
    right:10px!important;
    width:auto!important;
    height:42px!important;
    padding:0 14px!important;
    border-radius:8px!important;
    background:linear-gradient(180deg,#F6D96F,#C9A241)!important;
    color:#171310!important;
    border:1px solid #FFE28A!important;
    font:900 11px/1 Inter,Arial,sans-serif!important;
    letter-spacing:.06em!important;
    box-shadow:0 4px 14px rgba(0,0,0,.35)!important;
  }
  .side{
    border-left:0!important;
    border-top:1px solid rgba(232,197,90,.22)!important;
    padding:16px 12px 30px!important;
  }
  .side h2{font-size:20px!important;margin-bottom:4px!important}
  .tiny{font-size:12px!important;line-height:1.45!important}
  .zoom-box,.selected-box,.cloud-box,.calendar-box{
    border-radius:12px!important;
    padding:13px!important;
  }
  .actions{grid-template-columns:1fr!important;gap:9px!important}
  .actions button,.cloud-actions button,#exportBtn,#clearBtn{
    min-height:46px!important;
    font-size:13px!important;
    border-radius:8px!important;
  }
  .cloud-actions{grid-template-columns:1fr 1fr!important;gap:8px!important}
  .cloud-actions button.primary{
    background:linear-gradient(180deg,#F6D96F,#C9A241)!important;
    color:#171310!important;
    border-color:#F2D46C!important;
  }
  .slot-list{gap:8px!important}
  .slot-row{padding:11px!important;border-radius:10px!important}
  .calendar-fields{grid-template-columns:1fr!important}
  .calendar-fields input{min-height:42px!important;font-size:13px!important}
  .lightbox{padding:8px!important}
  .lightbox-frame{
    width:calc(100vw - 16px)!important;
    max-width:calc(100vw - 16px)!important;
    max-height:96vh!important;
    padding:6px!important;
    border-radius:12px!important;
  }
  .lightbox-frame img{
    max-width:100%!important;
    max-height:calc(96vh - 12px)!important;
    width:100%!important;
    height:auto!important;
    object-fit:contain!important;
  }
  .lightbox-close{
    top:8px!important;
    right:8px!important;
    width:42px!important;
    height:42px!important;
    z-index:5!important;
  }
  .lightbox-help{display:none!important}
  .footer{font-size:10px!important;line-height:1.4!important}
}
`;

  html=html.replace(
    "input[type=file] { display:none; }",
    cloudCss+"\ninput[type=file] { display:none; }"
  );

  html=html.replace(
    '<h2>Editor de soportes</h2>\n    <p class="tiny" id="pageHint">Taquilla cerrada · cinco soportes: fachada principal + Columna 1.</p>\n    <div class="pavon-support-note"><strong>Columna 1 · soporte adicional.</strong> La fachada principal mantiene los cuatro soportes frontales para producción. Columna 1 se gestionará como soporte auxiliar independiente para no perder esa vista limpia.</div>\n\n    <div class="zoom-box">',
    '<h2>Editor de soportes</h2>\n    <p class="tiny" id="pageHint">Taquilla cerrada · cuatro soportes.</p>\n\n    <div class="cloud-box">\n      <div class="cloud-top"><div class="cloud-title">Estado online</div><div id="cloudStatus" class="cloud-status">Conectando…</div></div>\n      <div class="cloud-actions"><button id="reloadCloudBtn">Recargar nube</button><button id="saveCloudBtn" class="primary">Guardar cambios</button></div>\n      <div id="cloudUpdated" class="cloud-updated">Cargando la última actualización…</div>\n    </div>\n\n    <div class="zoom-box">'
  );

  html=html.replace(
    'const calendarGrid = document.getElementById("calendarGrid");',
    'const calendarGrid = document.getElementById("calendarGrid");\n  const cloudStatus=document.getElementById("cloudStatus");\n  const cloudUpdated=document.getElementById("cloudUpdated");\n  const saveCloudBtn=document.getElementById("saveCloudBtn");\n  const reloadCloudBtn=document.getElementById("reloadCloudBtn");'
  );

  const cloudJs=`
  function slotCloudKey(slot){return slot.dataset.page+"__"+slot.dataset.id;}
  function setCloudStatus(text,kind=""){cloudStatus.textContent=text;cloudStatus.className="cloud-status"+(kind?" "+kind:"");}
  function markCloudDirty(){setCloudStatus("Cambios sin guardar","dirty");}
  function getEditKey(){
    let k="";
    try{k=sessionStorage.getItem("pavon_edit_key")||"";}catch(e){}
    if(!k){k=prompt("Clave de edición del panel Pavón:")||"";if(k){try{sessionStorage.setItem("pavon_edit_key",k);}catch(e){}}}
    return k||null;
  }
  async function compressDataUrl(dataUrl,maxSide=1800,quality=.88){
    if(!dataUrl||!dataUrl.startsWith("data:image/")) return dataUrl;
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=dataUrl;});
    const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
    if(scale===1 && dataUrl.length<1800000) return dataUrl;
    const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",quality);
  }
  async function fetchCloudImage(slot){
    const r=await fetch("/api/image?key="+encodeURIComponent(slotCloudKey(slot)),{cache:"no-store"});
    if(r.status===404)return null;if(!r.ok)throw new Error("No se pudo cargar "+slot.dataset.name);return await r.text();
  }
  async function loadCloudState(){
    setCloudStatus("Cargando…");reloadCloudBtn.disabled=true;
    try{
      const r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)throw new Error("No se pudo leer el estado online.");
      const payload=await r.json(),remote=payload.state||{},slots=remote.slots||{},schedule=remote.schedule||{};
      window.pavonPublicEdit=!!payload.publicEdit;
      window.pavonRequireKey=!!payload.requireKey;
      for(const slot of allSlots){
        const meta=slots[slotCloudKey(slot)]||{};
        state[key(slot)].mode=meta.mode||"contain";
        const old=slot.querySelector("img");if(old)old.remove();state[key(slot)].dataUrl=null;
        if(meta.hasImage){
          const data=await fetchCloudImage(slot);
          if(data){const media=slot.querySelector(".media"),img=document.createElement("img");img.src=data;img.style.objectFit=state[key(slot)].mode;media.appendChild(img);state[key(slot)].dataUrl=data;}
        }
        const sch=schedule[slotCloudKey(slot)]||{};
        try{localStorage.setItem(scheduleKey(slot,"date"),sch.date||"");localStorage.setItem(scheduleKey(slot,"next"),sch.next||"");}catch(e){}
      }
      renderList();renderCalendar();selectSlot(null);
      if(remote.updatedAt){cloudUpdated.textContent="Última actualización: "+new Date(remote.updatedAt).toLocaleString("es-ES");}
      else cloudUpdated.textContent="Todavía no hay una versión guardada en la nube.";
      if(window.pavonPublicEdit){cloudUpdated.textContent += " · Edición compartida activa";}
      setCloudStatus("Sincronizado","ok");
    }catch(e){console.error(e);setCloudStatus("Modo local","error");cloudUpdated.textContent="No se ha podido conectar con Netlify.";}
    finally{reloadCloudBtn.disabled=false;}
  }
  async function saveCloudState(){
    const editKey=window.pavonPublicEdit ? "" : getEditKey();if(!window.pavonPublicEdit && !editKey)return;
    saveCloudBtn.disabled=true;reloadCloudBtn.disabled=true;setCloudStatus("Guardando…");
    try{
      const slotMeta={},schedule={};
      for(const slot of allSlots){
        const sk=slotCloudKey(slot),s=state[key(slot)];
        if(s.dataUrl){
          const normalized=await compressDataUrl(s.dataUrl);
          const r=await fetch("/api/image?key="+encodeURIComponent(sk),{method:"PUT",headers:{"content-type":"text/plain;charset=utf-8",...(editKey?{"x-edit-key":editKey}:{})},body:normalized});
          if(r.status===401){try{sessionStorage.removeItem("pavon_edit_key");}catch(e){}throw new Error("Clave de edición incorrecta.");}
          if(!r.ok)throw new Error("No se pudo guardar "+slot.dataset.name);
          s.dataUrl=normalized;const img=slot.querySelector("img");if(img)img.src=normalized;
        }else{
          const r=await fetch("/api/image?key="+encodeURIComponent(sk),{method:"DELETE",headers:(editKey?{"x-edit-key":editKey}:{})});
          if(r.status===401){try{sessionStorage.removeItem("pavon_edit_key");}catch(e){}throw new Error("Clave de edición incorrecta.");}
          if(!r.ok&&r.status!==404)throw new Error("No se pudo borrar "+slot.dataset.name);
        }
        slotMeta[sk]={mode:s.mode||"contain",hasImage:!!s.dataUrl};
        let date="",next="";try{date=localStorage.getItem(scheduleKey(slot,"date"))||"";next=localStorage.getItem(scheduleKey(slot,"next"))||"";}catch(e){}
        schedule[sk]={date,next};
      }
      const updatedAt=new Date().toISOString();
      const r=await fetch("/api/state",{method:"PUT",headers:{"content-type":"application/json",...(editKey?{"x-edit-key":editKey}:{})},body:JSON.stringify({slots:slotMeta,schedule,updatedAt})});
      if(r.status===401){try{sessionStorage.removeItem("pavon_edit_key");}catch(e){}throw new Error("Clave de edición incorrecta.");}
      if(!r.ok)throw new Error("No se pudo guardar el estado general.");
      cloudUpdated.textContent="Última actualización: "+new Date(updatedAt).toLocaleString("es-ES");setCloudStatus("Guardado","ok");
    }catch(e){console.error(e);setCloudStatus("Error al guardar","error");alert(e.message||"No se han podido guardar los cambios.");}
    finally{saveCloudBtn.disabled=false;reloadCloudBtn.disabled=false;}
  }
  saveCloudBtn.addEventListener("click",saveCloudState);
  reloadCloudBtn.addEventListener("click",loadCloudState);
  calendarGrid.addEventListener("input",markCloudDirty);
  fileInput.addEventListener("change",markCloudDirty);
  fitBtn.addEventListener("click",markCloudDirty);
  removeBtn.addEventListener("click",markCloudDirty);
  clearBtn.addEventListener("click",markCloudDirty);
`;

  html=html.replace(
    'exportBtn.addEventListener("click", async () => {',
    cloudJs+'\n  exportBtn.addEventListener("click", async () => {'
  );

  html=html.replace(
    'renderList();\n  renderCalendar();\n})();',
    'renderList();\n  renderCalendar();\n  loadCloudState();\n})();'
  );
  // Mobile app identity / iPhone home-screen icon.
  const appHead = '<link rel="manifest" href="/manifest.webmanifest">' +
    '<link rel="apple-touch-icon" sizes="180x180" href="/pavon-app-icon.png">' +
    '<meta name="apple-mobile-web-app-capable" content="yes">' +
    '<meta name="mobile-web-app-capable" content="yes">' +
    '<meta name="apple-mobile-web-app-title" content="Pavón Cartelería">' +
    '<meta name="theme-color" content="#171310">';
  html = html.replace("</head>", appHead + "</head>");

  // Correct official theatre URL.
  html=html.replaceAll("https://elgranteatropavon.com/","https://www.granteatropavon.com/");
  html=html.replaceAll("https://elgranteatropavon.com","https://www.granteatropavon.com/");

  // Add mobile-friendly Calendar as a fourth navigation page without interfering with the editor tabs.
  const mobileEnhanceScript=`
<script>
window.addEventListener("DOMContentLoaded",()=>{
  const tabs=[...document.querySelectorAll(".tab")];
  if(tabs.length && !document.querySelector(".calendar-nav")){
    const a=document.createElement("a");
    a.href="/calendario.html";
    a.className="tab calendar-nav";
    a.textContent="Calendario";
    a.setAttribute("aria-label","Abrir calendario de programación");
    tabs[0].parentElement.appendChild(a);
  }

  const requested=new URLSearchParams(location.search).get("vista");
  const labels={
    taquilla:"taquilla cerrada",
    lona:"lona + secundarios",
    abierta:"taquilla abierta"
  };
  if(requested && labels[requested]){
    const target=[...document.querySelectorAll(".tab")]
      .find(el=>el.textContent.trim().toLowerCase()===labels[requested]);
    if(target) setTimeout(()=>target.click(),0);
  }

  document.querySelectorAll(".lightbox-trigger").forEach(btn=>{
    btn.textContent="VER GRANDE";
    btn.setAttribute("aria-label","Ver imagen en grande");
  });
});
<\/script>`;
  html=html.replace("</body>",mobileEnhanceScript+"</body>");


  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  console.error(err);
  document.body.innerHTML='<div class="boot"><div><strong>No se ha podido cargar la plantilla</strong><span>'+String(err.message||err)+'</span></div></div>';
});
</script>
</body>
</html>
