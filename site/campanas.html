<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yellow Control · Campañas del Pavón</title>
  <style>
    :root { color-scheme: dark; font-family: "Plus Jakarta Sans", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #15100e; color: #fffaf3; padding: 28px; }
    main { max-width: 1100px; margin: auto; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    p { color: #d6c5b6; margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); gap: 18px; }
    .venue { color: #d4ad71; font-size: 14px; font-weight: 700; letter-spacing: .05em; margin: 28px 0 12px; text-transform: uppercase; }
    .card { overflow: hidden; background: #241b17; border: 1px solid #4b3b30; border-radius: 18px; }
    .video-wrap { position: relative; aspect-ratio: 3 / 2; background: #0a0807; }
    video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .play { position: absolute; inset: 0; display: grid; place-items: center; border: 0; width: 100%; background: transparent; cursor: pointer; }
    .play span { display: grid; place-items: center; width: 58px; height: 58px; padding-left: 3px; border-radius: 50%; background: rgba(177, 137, 75, .94); color: #1b120b; font-size: 25px; box-shadow: 0 4px 24px #0008; }
    .card h2 { font-size: 17px; margin: 16px 16px 6px; }
    .card small { display: block; color: #c9b8a9; margin: 0 16px 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Campañas</h1>
    <p>Los vídeos se cargan solo al pulsar reproducir.</p>
    <h2 class="venue">Gran Teatro Pavón</h2>
    <section class="grid" aria-label="Vídeos de campaña">
      <article class="card">
        <div class="video-wrap"><video poster="assets/campanas/patricia-donn.jpg" playsinline controls aria-label="Patricia Donn"></video><button class="play" data-src="assets/campanas/patricia-donn.mp4" aria-label="Reproducir Patricia Donn"><span>▶</span></button></div>
        <h2>Patricia Donn</h2><small>Campaña Clece · 10 s</small>
      </article>
      <article class="card">
        <div class="video-wrap"><video poster="assets/campanas/best-seller.jpg" playsinline controls aria-label="Best Seller"></video><button class="play" data-src="assets/campanas/best-seller.mp4" aria-label="Reproducir Best Seller"><span>▶</span></button></div>
        <h2>Best Seller</h2><small>Campaña · 10 s</small>
      </article>
      <article class="card">
        <div class="video-wrap"><video poster="assets/campanas/el-imitador.jpg" playsinline controls aria-label="El Imitador"></video><button class="play" data-src="assets/campanas/el-imitador.mp4" aria-label="Reproducir El Imitador"><span>▶</span></button></div>
        <h2>El Imitador</h2><small>Campaña · 10 s</small>
      </article>
    </section>
    <h2 class="venue">Gran Teatro CaixaBank Príncipe Pío</h2>
    <section class="grid" aria-label="Vídeos de campaña de Gran Teatro CaixaBank Príncipe Pío">
      <article class="card">
        <div class="video-wrap"><video poster="assets/campanas/eva-soriano-septiembre.jpg" playsinline controls aria-label="Eva Soriano, septiembre"></video><button class="play" data-src="assets/campanas/eva-soriano-septiembre.mp4" aria-label="Reproducir Eva Soriano"><span>▶</span></button></div>
        <h2>Eva Soriano</h2><small>Campaña · Septiembre · 10 s</small>
      </article>
    </section>
  </main>
  <script>
    document.querySelectorAll('.play').forEach((button) => {
      button.addEventListener('click', () => {
        const video = button.previousElementSibling;
        if (!video.src) video.src = button.dataset.src;
        button.hidden = true;
        video.play();
      });
      button.previousElementSibling.addEventListener('play', () => { button.hidden = true; });
    });
  </script>
</body>
</html>
