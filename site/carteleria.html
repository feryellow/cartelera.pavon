  function enhanceScheduleFields(){

  async function compressDataUrl(dataUrl,maxSide=1800,quality=.88){
    if(!dataUrl||!dataUrl.startsWith("data:image/")) return dataUrl;
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=dataUrl;});
    const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
    if(scale===1 && dataUrl.length<1800000) return dataUrl;
    const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",quality);
  }

          localStorage.setItem(scheduleKey(slot,"next"),sch.next||"");
          for(const field of ["title","installDate","removeDate","status","notes"]){localStorage.setItem(slotMetaKey(slot,field),sch[field]||"");}

      renderList();renderCalendar();enhanceScheduleFields();selectSlot(null);
      if(remote.updatedAt){cloudUpdated.textContent="Última actualización: "+new Date(remote.updatedAt).toLocaleString("es-ES");}

    finally{reloadCloudBtn.disabled=false;}
  }
  async function saveCloudState(){
    const editKey=(window.pavonPublicEdit||window.pavonAuthenticated) ? "" : getEditKey();if(!window.pavonPublicEdit && !window.pavonAuthenticated && !editKey)return;
    saveCloudBtn.disabled=true;reloadCloudBtn.disabled=true;setCloudStatus("Guardando…");
    try{

        const sk=slotCloudKey(slot),s=state[key(slot)];
        if(s.dataUrl){
